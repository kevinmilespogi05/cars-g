# Netlify configuration for Cars-G
[build]
  # Force install devDependencies so native tools (esbuild, sharp) are available during build
  command = "npm ci --include=dev && npm run build"
  publish = "dist"
  environment = { NODE_ENV = "production" }

[[redirects]]
  # SPA fallback: serve index.html for all non-file requests
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  # Security headers for all routes (adjust CSP as needed)
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https: https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline' https:; connect-src 'self' https: wss:; img-src 'self' data: https: blob:; font-src 'self' https://r2cdn.perplexity.ai https://fonts.gstatic.com https://fonts.googleapis.com data:; manifest-src 'self'; worker-src 'self' blob:; frame-src 'self' https://www.google.com https://www.gstatic.com;"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
