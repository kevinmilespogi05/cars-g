<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpg" href="/images/logo.jpg" />
    <!-- Enhanced Mobile Viewport Configuration -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no" />
    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cars-G" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Cars-G" />
    <!-- Safe Area Insets for Notched Devices -->
    <meta name="viewport-fit" content="cover" />
    <!-- Theme and Color -->
    <meta name="theme-color" content="#800000" />
    <meta name="color-scheme" content="light dark" />
    <!-- SEO and Description -->
    <meta name="description" content="Your comprehensive car management and reporting system - report issues, track progress, and manage your fleet efficiently" />
    <meta name="keywords" content="car management, fleet management, issue reporting, vehicle maintenance, Cars-G" />
    <meta name="author" content="Cars-G Team" />
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cars-G" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Cars-G" />
    
    <!-- Android Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    
    <!-- Additional PWA Meta Tags -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#800000" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://mffuqdwqjdxbwpbhuxby.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Leaflet CSS for maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://cars-g.onrender.com" />
    <meta property="og:title" content="Cars-G" />
    <meta property="og:description" content="Your comprehensive car management and reporting system" />
    <meta property="og:image" content="https://cars-g.onrender.comlogo.jpg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://cars-g.onrender.com" />
    <meta property="twitter:title" content="Cars-G" />
    <meta property="twitter:description" content="Your comprehensive car management and reporting system" />
    <meta property="twitter:image" content="https://cars-g.onrender.comlogo.jpg" />
    
    <!-- Mobile-specific meta tags -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-TileColor" content="#800000" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    
    <title>Cars-G</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- PWA Installation prompt script -->
    <script>
      // Check if the app is running as a PWA
      if (window.matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.classList.add('pwa-mode');
      }
      
      // Add mobile-specific body class
      if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
        document.body.classList.add('mobile-device');
      }
    </script>
  </body>
</html>
